name: Release

# Conventional commits on main are collected by release-please into a "Release PR"
# (version bump + changelog); auto-merge below merges it as soon as the required CI
# check passes (see the branch-protection note further down). Merging pushes to main,
# which triggers this workflow again: release-please tags vX.Y.Z and creates the
# GitHub release, and the macOS job attaches the bundles to it.
#
# Two things outside this file make the flow unattended:
# 1. The RELEASE_PLEASE_TOKEN secret (Settings -> Secrets and variables ->
#    Actions) must hold a PAT with Contents (write), Pull requests (write) and
#    Workflows (write). With the default GITHUB_TOKEN the release PR is authored
#    by github-actions[bot], which GitHub treats as an outside collaborator: the
#    PR's CI runs then require manual approval and fail unapproved. A PAT makes
#    the PR author its owner, so CI runs unattended, and makes the auto-merge
#    push to main trigger this workflow (GITHUB_TOKEN pushes do not), so the
#    release is tagged right away.
# 2. Branch protection on main must require the CI status check (the `test` job
#    from ci.yml; see Settings -> Branches). Auto-merge only merges after
#    required checks pass, so this is what makes the release wait for a green
#    build instead of merging instantly. If CI fails, the PR stays open; fix and
#    re-run CI, then merge by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# One release at a time: a newer push waits in the queue instead of racing the
# run that is already building.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap job (Ubuntu, seconds): decides whether a release is due, then enables
  # auto-merge on the release PR so GitHub merges it once CI is green.
  release:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release-please.outputs.release_created }}
      tag-name: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # `if:` conditions can't read secrets, so this checks via the shell.
      - name: Warn if RELEASE_PLEASE_TOKEN is not set
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::RELEASE_PLEASE_TOKEN secret is not set. Release PRs will be authored by github-actions[bot], so their CI runs will need manual approval and will fail unapproved. Add a PAT with Contents (write), Pull requests (write) and Workflows (write) scopes."
          fi

      # Keeps the flow hands-off: the release PR merges itself as soon as the
      # required `test` check is green. Needs "Allow auto-merge" in Settings ->
      # General and the branch-protection rule described above. A warning, not
      # an error, so the PR is still there to merge by hand if a setting or the
      # token is missing.
      - name: Enable auto-merge on the release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Look the PR up through the REST API, not `gh pr list` (which uses
          # the search index and can lag behind the label release-please just
          # applied in the step above). Retry briefly to ride out any lag.
          pr_number=""
          for attempt in 1 2 3 4 5; do
            pr_number=$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100" \
              --jq '[.[] | select(any(.labels[]?; .name == "autorelease: pending"))][0].number // empty')
            if [ -n "$pr_number" ]; then
              break
            fi
            echo "No pending release PR found (attempt $attempt); retrying in 5s"
            sleep 5
          done
          if [ -z "$pr_number" ]; then
            echo "No pending release PR found"
            exit 0
          fi
          if ! gh pr merge "$pr_number" --auto --squash 2>err.txt; then
            if grep -qi "auto-merge" err.txt; then
              echo "auto-merge already enabled or unavailable on PR #$pr_number"
            else
              echo "::warning::could not enable auto-merge on PR #$pr_number; merge it by hand to cut the release"
              cat err.txt
            fi
          fi

  # Only runs when a version was actually released: a universal macOS build
  # costs ~10 minutes of runner time.
  release-macos:
    needs: release
    if: needs.release.outputs.release-created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Both targets are needed for a universal (Apple Silicon + Intel) build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: host -> target

      - run: npm ci

      # release-please already created the release with the changelog; preserve
      # that body and append the Gatekeeper instructions.
      - name: Prepare release body
        id: release-body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag-name }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.body // ""')
          note='The app is ad-hoc signed but not notarized. On first launch macOS will block it: open System Settings -> Privacy & Security and click "Open Anyway" next to the Edytka message.'
          {
            echo "body<<EOF"
            if [ -n "$existing" ]; then echo "$existing"; echo ""; fi
            echo "## Installing"
            echo ""
            echo "$note"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The release and its tag already exist (created by release-please in the
      # job above), so tauri-action only uploads to them.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ needs.release.outputs.tag-name }}
          releaseName: Edytka ${{ needs.release.outputs.tag-name }}
          releaseBody: ${{ steps.release-body.outputs.body }}
