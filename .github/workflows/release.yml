name: Release

# Conventional commits on main are collected by release-please into a "Release PR"
# (version bump + changelog). This workflow then waits for CI to pass on that PR,
# enables auto-merge, and when the PR merges, release-please (running again on the
# push to main) tags vX.Y.Z and creates the GitHub release; the macOS job then runs
# in the same workflow and attaches the bundles to it.
#
# A PAT must be stored in the RELEASE_PLEASE_TOKEN secret (repo Settings ->
# Secrets and variables -> Actions). Why: with the default GITHUB_TOKEN the
# release PR is authored by github-actions[bot], which GitHub treats as an
# outside collaborator - the PR's CI runs then require manual approval and fail
# unapproved (a red X on every release PR). A PAT makes the PR author its owner,
# so CI runs unattended. It also makes the auto-merge below push to main as the
# owner, and pushes that don't come from GITHUB_TOKEN do trigger this workflow,
# so the release is tagged right away instead of on the next manual push to main.
# The PAT needs Contents (write), Pull requests (write) and Workflows (write).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# One release at a time: a newer push waits in the queue instead of racing the
# run that is already building. The release job also waits for CI on the release
# PR (~3 minutes warm cache, up to ~15 minutes cold), so a run can take a while.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap job (Ubuntu): decides whether a release is due, then shepherds the
  # release PR - wait for CI to pass on it, then enable auto-merge.
  release:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release-please.outputs.release_created }}
      tag-name: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # `if:` conditions can't read secrets, so this checks via the shell.
      - name: Warn if RELEASE_PLEASE_TOKEN is not set
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::RELEASE_PLEASE_TOKEN secret is not set. Release PRs will be authored by github-actions[bot], so their CI runs will need manual approval and will fail unapproved. Add a PAT with Contents (write), Pull requests (write) and Workflows (write) scopes."
          fi

      - name: Find the release pull request
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Look the PR up through the REST API, not `gh pr list` (which uses
          # the search index and can lag behind the label release-please just
          # applied in the step above). Retry briefly to ride out any lag.
          pr_number=""
          for attempt in 1 2 3 4 5; do
            pr_number=$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100" \
              --jq '[.[] | select(any(.labels[]?; .name == "autorelease: pending"))][0].number // empty')
            if [ -n "$pr_number" ]; then
              break
            fi
            echo "No pending release PR found (attempt $attempt); retrying in 5s"
            sleep 5
          done
          if [ -z "$pr_number" ]; then
            echo "No pending release PR found"
            exit 0
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      # Wait for the PR's own CI before merging, so a release never goes out
      # unverified. The check-run name is the ci.yml job name (`test`), and the
      # check-runs endpoint is per-commit, so only runs on the current head are
      # considered (re-fetched every iteration, in case release-please updates
      # the PR while we wait).
      - name: Wait for CI to pass on the release PR
        id: wait-ci
        if: steps.find-pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.find-pr.outputs.number }}
        run: |
          deadline=$((SECONDS + 1800))  # 30 minutes, generous for a cold cache
          while true; do
            sha=$(gh api "repos/$GH_REPO/pulls/$PR" --jq '.head.sha')
            result=$(gh api "repos/$GH_REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.[] | select(.name == "test")] | sort_by(.id) | last | .conclusion // ""')
            echo "CI on ${sha:0:8}: ${result:-in progress} (${SECONDS}s elapsed)"
            case "$result" in
              success)
                echo "outcome=green" >> "$GITHUB_OUTPUT"
                break ;;
              failure|cancelled|timed_out|startup_failure)
                echo "::warning::CI finished as '$result' on release PR #$PR; not enabling auto-merge. Fix and re-run CI, then merge by hand or push to main again."
                echo "outcome=red" >> "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
            if (( SECONDS >= deadline )); then
              echo "::warning::timed out waiting for CI on release PR #$PR; not enabling auto-merge. Merge by hand or push to main again."
              echo "outcome=timeout" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done

      # Keeps the flow hands-off: the release PR merges itself as soon as its CI
      # is green. Needs "Allow auto-merge" in Settings -> General. A warning, not
      # an error, so the PR is still there to merge by hand if the setting or
      # token is missing.
      - name: Enable auto-merge on the release pull request
        if: steps.find-pr.outputs.number != '' && steps.wait-ci.outputs.outcome == 'green'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.find-pr.outputs.number }}
        run: |
          if ! gh pr merge "$PR" --auto --squash 2>err.txt; then
            if grep -qi "auto-merge" err.txt; then
              echo "auto-merge already enabled or unavailable on PR #$PR"
            else
              echo "::warning::could not enable auto-merge on PR #$PR; merge it by hand to cut the release"
              cat err.txt
            fi
          fi

  # Only runs when a version was actually released: a universal macOS build
  # costs ~10 minutes of runner time.
  release-macos:
    needs: release
    if: needs.release.outputs.release-created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Both targets are needed for a universal (Apple Silicon + Intel) build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: host -> target

      - run: npm ci

      # release-please already created the release with the changelog; preserve
      # that body and append the Gatekeeper instructions.
      - name: Prepare release body
        id: release-body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag-name }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.body // ""')
          note='The app is ad-hoc signed but not notarized. On first launch macOS will block it: open System Settings -> Privacy & Security and click "Open Anyway" next to the Edytka message.'
          {
            echo "body<<EOF"
            if [ -n "$existing" ]; then echo "$existing"; echo ""; fi
            echo "## Installing"
            echo ""
            echo "$note"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The release and its tag already exist (created by release-please in the
      # job above), so tauri-action only uploads to them.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ needs.release.outputs.tag-name }}
          releaseName: Edytka ${{ needs.release.outputs.tag-name }}
          releaseBody: ${{ steps.release-body.outputs.body }}
